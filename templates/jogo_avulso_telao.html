<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telão avulso</title><style>
*{box-sizing:border-box}body{margin:0;background:#06111f;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.aviso-horizontal{display:none;position:fixed;inset:0;z-index:99999;background:#06111f;color:#fff;align-items:center;justify-content:center;text-align:center;padding:28px}.aviso-horizontal strong{display:block;font-size:34px;font-weight:1000;margin-bottom:10px}.aviso-horizontal p{font-size:18px;color:#cbd5e1;font-weight:800;margin:0}.conteudo-telao{width:100vw;height:100vh;overflow:hidden}.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;z-index:3;gap:12px}.btn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.10);color:#fff;border-radius:14px;padding:10px 14px;font-weight:900;cursor:pointer}.wrap{height:100vh;display:grid;grid-template-columns:1fr 220px 1fr;gap:22px;padding:80px 40px 40px}.team{border-radius:36px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(160deg,#123b72,#0b1f3a);box-shadow:0 24px 80px rgba(0,0,0,.35);min-width:0}.team h1{font-size:clamp(32px,5vw,78px);text-align:center;margin:0 0 20px;font-weight:1000;line-height:1.02;word-break:break-word}.pts{font-size:clamp(110px,18vw,260px);line-height:.8;font-weight:1000}.center{border-radius:30px;background:#fff;color:#06111f;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:14px}.center .set{font-size:62px;font-weight:1000}.center .sets{font-size:54px;font-weight:1000}@media (orientation: portrait) and (max-width: 900px){.aviso-horizontal{display:flex}.conteudo-telao{display:none}}@media (orientation: landscape) and (max-width: 950px){.conteudo-telao{width:100vw;min-height:100vh}.top{top:8px;left:8px;right:8px;font-size:12px}.btn{padding:8px 10px;border-radius:10px;font-size:12px}.wrap{height:100vh;grid-template-columns:1fr 120px 1fr;gap:8px;padding:48px 8px 8px}.team{border-radius:18px;padding:10px}.team h1{font-size:clamp(18px,4vw,32px);margin-bottom:8px}.pts{font-size:clamp(72px,16vw,125px)}.center{border-radius:18px;padding:8px}.center .set{font-size:34px}.center .sets{font-size:30px}}@media (max-width: 900px) and (orientation: portrait){.wrap{grid-template-columns:1fr;padding:80px 16px 16px}.center{order:-1}.pts{font-size:110px}}
</style></head><body><div class="aviso-horizontal"><div><strong>Vire o celular</strong><p>Esta tela foi feita para uso com o celular deitado.</p></div></div><div class="conteudo-telao"><div class="top"><div><b>Jogo Avulso</b> • {{ codigo }}</div><button class="btn" onclick="inv()">Inverter lados do telão</button></div><div class="wrap"><div class="team" id="esq"></div><div class="center" id="centro"></div><div class="team" id="dir"></div></div><script>
const CODIGO={{ codigo|tojson }}, ESTADO_INICIAL={{ estado|tojson }}, endpoint=`/apontador/jogo-avulso/${CODIGO}/estado`, LS_INV=`jogo_avulso_inversao_telao_${CODIGO}`;let estado=ESTADO_INICIAL||{},invertido=localStorage.getItem(LS_INV)==='1',ultimoPopup=0;
function nome(l){return l==='A'?(estado.equipe_a||'Equipe A'):(estado.equipe_b||'Equipe B')}function pts(l){return l==='A'?(estado.pontos_a||0):(estado.pontos_b||0)}function sets(l){return l==='A'?(estado.sets_a||0):(estado.sets_b||0)}function lado(p){return invertido?(p==='e'?'B':'A'):(p==='e'?'A':'B')}function team(l){return `<h1>${nome(l)}</h1><div class='pts'>${pts(l)}</div>`}
function render(){const le=lado('e'),ld=lado('d');document.getElementById('esq').innerHTML=team(le);document.getElementById('dir').innerHTML=team(ld);document.getElementById('centro').innerHTML=`<div>SET</div><div class='set'>${estado.set_atual||1}º</div><div>SETS</div><div class='sets'>${sets('A')} x ${sets('B')}</div>`}function inv(){invertido=!invertido;localStorage.setItem(LS_INV,invertido?'1':'0');render()}async function sync(){try{const r=await fetch(endpoint,{cache:'no-store'});const j=await r.json();if(j.estado){estado=j.estado;render()}}catch(e){}}render();
setInterval(() => { if (document.visibilityState === "visible") sync(); }, 3000);
sync();
</script></div></body></html>
