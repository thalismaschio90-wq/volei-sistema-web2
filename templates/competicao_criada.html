{% extends "base.html" %}

{% block conteudo %}
<style>
    .created-wrap {
        max-width: 820px;
        margin: 0 auto;
    }

    .created-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 26px;
        box-shadow: var(--shadow);
        overflow: hidden;
    }

    .created-hero {
        background: linear-gradient(135deg, #111827, #123852 62%, #071827);
        color: #fff;
        padding: 26px;
    }

    .created-kicker {
        font-size: 13px;
        font-weight: 1000;
        color: rgba(255,255,255,.72);
        text-transform: uppercase;
        letter-spacing: .4px;
    }

    .created-title {
        margin-top: 6px;
        font-size: clamp(26px, 4vw, 40px);
        font-weight: 1000;
        line-height: 1;
    }

    .created-body {
        padding: 22px;
    }

    .created-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
    }

    .created-info {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 13px;
        min-width: 0;
    }

    .created-label {
        color: #64748b;
        font-size: 12px;
        font-weight: 1000;
        text-transform: uppercase;
        margin-bottom: 5px;
    }

    .created-value {
        color: #0f172a;
        font-size: 16px;
        font-weight: 1000;
        overflow-wrap: anywhere;
    }

    .created-actions {
        margin-top: 18px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .created-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        border-radius: 16px;
        padding: 12px 16px;
        font-weight: 1000;
        background: #123852;
        color: #fff;
    }

    .created-btn.secondary {
        background: #eef4fb;
        color: #123852;
        border: 1px solid #dbeafe;
    }

    @media (max-width: 700px) {
        .created-grid {
            grid-template-columns: 1fr;
        }

        .created-actions,
        .created-btn {
            width: 100%;
        }
    }
</style>

<div class="created-wrap">
    <div class="created-card">
        <div class="created-hero">
            <div class="created-kicker">Nova competição</div>
            <div class="created-title">Competição criada com sucesso</div>
        </div>

        <div class="created-body">
            <div class="created-grid">
                <div class="created-info">
                    <div class="created-label">Competição</div>
                    <div class="created-value">{{ nome }}</div>
                </div>
                <div class="created-info">
                    <div class="created-label">Login do organizador</div>
                    <div class="created-value">{{ login }}</div>
                </div>
                <div class="created-info">
                    <div class="created-label">Senha</div>
                    <div class="created-value">{{ senha }}</div>
                </div>
            </div>

            <div class="created-actions">
                <a class="created-btn" href="{{ url_for('competicoes.listar') }}">🏆 Voltar para competições</a>
                <a class="created-btn secondary" href="{{ url_for('competicoes.nova') if 'competicoes.nova' else '/competicoes/nova' }}">➕ Criar outra</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
