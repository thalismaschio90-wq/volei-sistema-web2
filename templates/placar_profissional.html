<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar ao Vivo</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>

:root {
    --text: #f8fafc;
    --gold: #f6c945;
    --cor-a: #2e6be6;
    --cor-b: #e53935;
    --ink: #0f2f4a;
}

* { box-sizing: border-box; }

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 18% 10%, color-mix(in srgb, var(--cor-a) 26%, transparent), transparent 34%),
        radial-gradient(circle at 82% 10%, color-mix(in srgb, var(--cor-b) 26%, transparent), transparent 34%),
        linear-gradient(135deg, #f0f6ff 0%, #dfeaf6 48%, #fbfdff 100%);
}

.telao {
    width: 100vw;
    height: 100vh;
    aspect-ratio: 16 / 9;
    display: grid;
    grid-template-rows: 70px minmax(0, 1fr);
    gap: 12px;
    padding: 16px 22px 20px;
}

.topo {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
}

.status {
    justify-self: center;
    max-width: 1080px;
    min-width: 470px;
    padding: 10px 28px;
    border: 2px solid rgba(255,255,255,.62);
    border-radius: 999px;
    background: rgba(15, 47, 74, .13);
    color: var(--ink);
    text-align: center;
    font-size: clamp(21px, 1.9vw, 32px);
    font-weight: 1000;
    letter-spacing: .06em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    backdrop-filter: blur(10px);
}

.btn-inverter {
    justify-self: end;
    border: 2px solid rgba(15,47,74,.18);
    background: rgba(255,255,255,.80);
    color: var(--ink);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(15,47,74,.10);
}

.miolo {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 310px minmax(0, 1fr);
    gap: 18px;
    align-items: stretch;
}

.equipe {
    min-width: 0;
    border-radius: 34px;
    overflow: hidden;
    border: 4px solid rgba(255,255,255,.40);
    display: grid;
    grid-template-rows: 148px minmax(0, 1fr);
    box-shadow: 0 24px 62px rgba(15,23,42,.22);
    position: relative;
}

.equipe::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 50% 18%, rgba(255,255,255,.28), transparent 34%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.10));
    pointer-events: none;
}

.equipe-a {
    background:
        linear-gradient(145deg,
            color-mix(in srgb, var(--cor-a) 90%, #ffffff 10%),
            color-mix(in srgb, var(--cor-a) 68%, #071827 32%)
        );
}

.equipe-b {
    background:
        linear-gradient(145deg,
            color-mix(in srgb, var(--cor-b) 90%, #ffffff 10%),
            color-mix(in srgb, var(--cor-b) 68%, #071827 32%)
        );
}

.nome-linha {
    min-width: 0;
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 26px 118px minmax(0, 1fr);
    align-items: center;
    gap: 18px;
    padding: 18px 24px;
    border-bottom: 4px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.10);
}

.nome-linha.direita {
    grid-template-columns: minmax(0, 1fr) 118px 26px;
    text-align: right;
}

.bolinha-saque {
    width: 20px;
    height: 20px;
    border-radius: 999px;
    background: rgba(255,255,255,.26);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.24);
}

.bolinha-saque.ativo {
    background: var(--gold);
    box-shadow: 0 0 0 6px rgba(246,201,69,.18), 0 0 32px rgba(246,201,69,.95);
}

.escudo-telao {
    width: 108px;
    height: 108px;
    object-fit: contain;
    border-radius: 24px;
    background: rgba(255,255,255,.18);
    padding: 10px;
    filter: drop-shadow(0 14px 30px rgba(0,0,0,.30));
}

.nome-equipe {
    min-width: 0;
    font-size: clamp(32px, 3.3vw, 62px);
    line-height: .94;
    font-weight: 1000;
    text-transform: uppercase;
    letter-spacing: -.035em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 0 8px 20px rgba(0,0,0,.24);
}

.pontos {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: clamp(10px, 2.2vh, 26px);
    font-size: clamp(280px, 27vw, 470px);
    line-height: .80;
    font-weight: 1000;
    letter-spacing: -.08em;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 18px 36px rgba(0,0,0,.26);
}

.pontos.animar { animation: popPonto .24s ease-out; }

@keyframes popPonto {
    0% { transform: scale(1); }
    45% { transform: scale(1.06); }
    100% { transform: scale(1); }
}

.centro-vertical {
    min-width: 0;
    display: grid;
    grid-template-rows: 190px minmax(0, 1fr);
    gap: 14px;
}

.sets-box,
.evolucao-vertical {
    border: 2px solid rgba(15,47,74,.12);
    border-radius: 30px;
    background: rgba(255,255,255,.78);
    box-shadow: 0 18px 44px rgba(15,47,74,.13);
    backdrop-filter: blur(12px);
    color: var(--ink);
}

.sets-box {
    padding: 16px;
    text-align: center;
    display: grid;
    align-content: center;
}

.set-label,
.evolucao-titulo {
    color: var(--ink);
    font-size: 14px;
    font-weight: 1000;
    letter-spacing: .13em;
    text-transform: uppercase;
}

.sets-valor {
    margin: 12px 0;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
}

.set-num {
    height: 68px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    line-height: 1;
    font-weight: 1000;
    color: #fff;
    font-variant-numeric: tabular-nums;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.20);
}

.set-a { background: var(--cor-a); }
.set-b { background: var(--cor-b); }

.set-x {
    font-size: 28px;
    font-weight: 1000;
    color: rgba(15,47,74,.62);
}

.set-atual {
    display: inline-flex;
    justify-content: center;
    justify-self: center;
    min-width: 138px;
    border: 2px solid rgba(246,201,69,.62);
    background: rgba(246,201,69,.18);
    border-radius: 999px;
    padding: 8px 16px;
    color: #8a6500;
    font-size: 20px;
    font-weight: 1000;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.evolucao-vertical {
    min-height: 0;
    padding: 16px 15px;
    display: grid;
    grid-template-rows: auto auto minmax(0, 1fr);
    gap: 12px;
}

.evolucao-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
}

.evolucao-contador {
    color: rgba(15,47,74,.70);
    font-size: 13px;
    font-weight: 1000;
    white-space: nowrap;
}

.evolucao-legenda {
    display: grid;
    grid-template-columns: 1fr 36px 1fr;
    gap: 8px;
    align-items: center;
    color: rgba(15,47,74,.78);
    font-size: 13px;
    font-weight: 1000;
    text-transform: uppercase;
}

.evolucao-legenda .lado-a { text-align: right; color: var(--cor-a); }
.evolucao-legenda .lado-b { text-align: left; color: var(--cor-b); }
.evolucao-legenda .meio { text-align: center; opacity: .55; }

.timeline-vertical {
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 8px;
    padding-top: 4px;
}

.ponto-vertical {
    display: grid;
    grid-template-columns: 1fr 26px 1fr;
    align-items: center;
    gap: 9px;
    min-height: 24px;
    font-size: 12px;
    font-weight: 1000;
}

.ponto-vertical > span {
    min-height: 22px;
    display: flex;
    align-items: center;
}

.ponto-vertical .ponto-esq { justify-content: flex-end; }
.ponto-vertical .ponto-dir { justify-content: flex-start; }
.ponto-vertical .ponto-meio { justify-content: center; opacity: .22; }

.ponto-marcador {
    width: 24px;
    height: 24px;
    border-radius: 999px;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    color: #fff;
    font-size: 12px;
    font-weight: 1000;
    line-height: 1;
    box-shadow: 0 0 14px rgba(15,47,74,.20);
}

.ponto-marcador.a { background: var(--cor-a); }
.ponto-marcador.b { background: var(--cor-b); }

.ponto-vazio-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: rgba(15,47,74,.10);
    display: inline-block;
}

.ponto-vertical.vazio { opacity: .42; }
.sem-jogo .equipe { opacity: .86; }

@media (max-width: 1150px) {
    .telao { padding: 12px; gap: 10px; }
    .miolo { grid-template-columns: minmax(0,1fr) 240px minmax(0,1fr); gap: 10px; }
    .centro-vertical { grid-template-rows: 170px minmax(0,1fr); }
    .nome-linha { grid-template-columns: 20px 76px minmax(0,1fr); padding: 12px; gap: 10px; }
    .nome-linha.direita { grid-template-columns: minmax(0,1fr) 76px 20px; }
    .escudo-telao { width: 72px; height: 72px; border-radius: 18px; padding: 7px; }
    .pontos { font-size: clamp(170px, 24vw, 300px); }
    .ponto-vertical { gap: 6px; min-height: 19px; }
    .ponto-marcador { width: 19px; height: 19px; font-size: 10px; }
}

</style>
</head>
<body>
<div id="telao" class="telao sem-jogo">
    <div class="topo">
        <div></div>
        <div class="status" id="infoJogo">AGUARDANDO JOGO AO VIVO</div>
        <button id="btnInverter" class="btn-inverter" type="button">↔ Inverter lados</button>
    </div>

    <main class="miolo">
        <section id="cardA" class="equipe equipe-a">
            <div class="nome-linha">
                <span id="saqueA" class="bolinha-saque"></span>
                <img id="escudoA" class="escudo-telao" src="/static/img/escudo_padrao.svg" alt="Escudo Equipe A">
                <div id="nomeA" class="nome-equipe">Equipe A</div>
            </div>
            <div id="pontosA" class="pontos">0</div>
        </section>

        <aside class="centro-vertical">
            <div class="sets-box">
                <div class="set-label">SETS</div>
                <div class="sets-valor">
                    <div id="setsA" class="set-num set-a">0</div>
                    <div class="set-x">×</div>
                    <div id="setsB" class="set-num set-b">0</div>
                </div>
                <div id="setAtual" class="set-atual">1º SET</div>
            </div>

            <section id="rodapeEvolucao" class="evolucao-vertical">
                <div class="evolucao-head">
                    <div class="evolucao-titulo">Ponto a ponto</div>
                    <div id="evolucaoContador" class="evolucao-contador">0 pontos</div>
                </div>
                <div class="evolucao-legenda">
                    <span id="labelVerticalA" class="lado-a">A</span>
                    <span class="meio">●</span>
                    <span id="labelVerticalB" class="lado-b">B</span>
                </div>
                <div id="timelineVertical" class="timeline-vertical"></div>
            </section>
        </aside>

        <section id="cardB" class="equipe equipe-b">
            <div class="nome-linha direita">
                <div id="nomeB" class="nome-equipe">Equipe B</div>
                <img id="escudoB" class="escudo-telao" src="/static/img/escudo_padrao.svg" alt="Escudo Equipe B">
                <span id="saqueB" class="bolinha-saque"></span>
            </div>
            <div id="pontosB" class="pontos">0</div>
        </section>
    </main>
</div>
<script>
const apontador = {{ (apontador if apontador is defined else '') | tojson }};
const ESTADO_INICIAL = {{ (estado if estado is defined else {}) | tojson | safe }};
const socket = io();

const telao = document.getElementById("telao");
const infoJogo = document.getElementById("infoJogo");

const nomeA = document.getElementById("nomeA");
const nomeB = document.getElementById("nomeB");
const escudoA = document.getElementById("escudoA");
const escudoB = document.getElementById("escudoB");
const pontosA = document.getElementById("pontosA");
const pontosB = document.getElementById("pontosB");

const setsA = document.getElementById("setsA");
const setsB = document.getElementById("setsB");
const setAtualEl = document.getElementById("setAtual");

const saqueA = document.getElementById("saqueA");
const saqueB = document.getElementById("saqueB");

const btnInverter = document.getElementById("btnInverter");
const rodapeEvolucao = document.getElementById("rodapeEvolucao");
const timelineVertical = document.getElementById("timelineVertical");
const evolucaoContador = document.getElementById("evolucaoContador");
const labelVerticalA = document.getElementById("labelVerticalA");
const labelVerticalB = document.getElementById("labelVerticalB");

let ultimoEstado = null;
let ultimosPontosA = 0;
let ultimosPontosB = 0;

/*
  EVOLUÇÃO PERSISTENTE:
  - A fonte principal é dados.evolucao_pontos, montada no backend pelos eventos salvos.
  - Se atualizar, sair ou voltar para a partida, o telão reconstrói a evolução pelo banco.
  - O cálculo local abaixo fica apenas como reserva enquanto o socket ainda não trouxe histórico.
*/
let evolucaoAtiva = false;
let evolucaoCongelada = false;
let evolucaoPartidaId = "";
let evolucaoSetAtual = 1;
let evolucaoPontos = [];

function chaveInversao(dados) {
    const partida = dados && dados.partida_id ? String(dados.partida_id) : "sem_partida";
    const ap = apontador || "sem_apontador";
    return `placar_invertido_${ap}_${partida}`;
}

function chaveInversaoPartidaId(partidaId) {
    return `placar_inversao_apontador_${String(partidaId || "sem_partida")}`;
}

function boolInversao(valor) {
    return valor === true || valor === 1 || valor === "1" || String(valor || "").toLowerCase() === "true";
}

function getInvertidoVisual(dados) {
    // Prioridade máxima: o jogo do apontador manda esta flag.
    // Assim o telão fica igual ao que o apontador está vendo.
    if (dados && Object.prototype.hasOwnProperty.call(dados, "lados_invertidos_apontador")) {
        return boolInversao(dados.lados_invertidos_apontador);
    }
    if (dados && Object.prototype.hasOwnProperty.call(dados, "lados_invertidos")) {
        return boolInversao(dados.lados_invertidos);
    }

    const partidaId = dados && dados.partida_id ? String(dados.partida_id) : "";
    if (partidaId) {
        try {
            const salvo = JSON.parse(localStorage.getItem(chaveInversaoPartidaId(partidaId)) || "null");
            if (salvo && Object.prototype.hasOwnProperty.call(salvo, "invertido")) {
                return boolInversao(salvo.invertido);
            }
        } catch (e) {}
    }

    return localStorage.getItem(chaveInversao(dados)) === "1";
}

function setInvertidoVisual(dados, valor) {
    localStorage.setItem(chaveInversao(dados), valor ? "1" : "0");
    if (dados) {
        dados.lados_invertidos_apontador = !!valor;
        dados.lados_invertidos = !!valor;
    }
}

btnInverter.addEventListener("click", function () {
    // Botão local do telão fica só para emergência.
    // Quando o apontador inverter, o evento dele sobrescreve este valor.
    const atual = getInvertidoVisual(ultimoEstado || {});
    setInvertidoVisual(ultimoEstado || {}, !atual);
    if (ultimoEstado) aplicarEstado(ultimoEstado);
});

socket.on("connect", () => {
    if (apontador) {
        socket.emit("entrar_placar_apontador", { apontador: apontador });
    }
});

socket.on("inversao_lados_apontador", (dados) => {
    if (!dados || typeof dados !== "object") return;
    const partidaId = String(dados.partida_id || "");

    if (ultimoEstado && partidaId && String(ultimoEstado.partida_id || "") !== partidaId) {
        return;
    }

    const invertido = boolInversao(dados.lados_invertidos_apontador ?? dados.invertido);
    if (ultimoEstado) {
        ultimoEstado.lados_invertidos_apontador = invertido;
        ultimoEstado.lados_invertidos = invertido;
        aplicarEstado(ultimoEstado);
    }
});

window.addEventListener("storage", (ev) => {
    if (!ev.key || !ev.key.startsWith("placar_inversao_apontador_")) return;
    if (!ultimoEstado) return;
    try {
        const dados = JSON.parse(ev.newValue || "{}");
        const partidaId = String(dados.partida_id || "");
        if (partidaId && String(ultimoEstado.partida_id || "") !== partidaId) return;
        const invertido = boolInversao(dados.lados_invertidos_apontador ?? dados.invertido);
        ultimoEstado.lados_invertidos_apontador = invertido;
        ultimoEstado.lados_invertidos = invertido;
        aplicarEstado(ultimoEstado);
    } catch (e) {}
});

function normalizarLado(valor) {
    const v = String(valor || "").trim().toUpperCase();
    if (v === "A" || v === "EQUIPE_A" || v === "AZUL") return "A";
    if (v === "B" || v === "EQUIPE_B" || v === "VERMELHO") return "B";
    return "";
}

function nomeEquipeA(dados) {
    // A tela do apontador trabalha com equipe_a_operacional/equipe_b_operacional.
    // Se usar equipe_a/equipe_b primeiro, o placar fica preso no lado inicial da tabela
    // e mostra nome de uma equipe com pontuação/saque da outra.
    return dados.equipe_a_operacional || dados.equipe_a_nome || dados.nome_a || dados.time_a || dados.equipe_a || "Equipe A";
}

function nomeEquipeB(dados) {
    return dados.equipe_b_operacional || dados.equipe_b_nome || dados.nome_b || dados.time_b || dados.equipe_b || "Equipe B";
}

function statusPartida(dados) {
    return String(
        dados.status ||
        dados.status_partida ||
        dados.fase_partida ||
        dados.situacao ||
        ""
    ).trim().toLowerCase();
}

function partidaEstaFinalizada(dados) {
    const st = statusPartida(dados);
    return (
        st.includes("finalizada") ||
        st.includes("finalizado") ||
        st.includes("encerrada") ||
        st.includes("encerrado") ||
        dados.finalizada === true ||
        dados.partida_finalizada === true
    );
}

function partidaEstaAoVivo(dados) {
    const st = statusPartida(dados);
    return (
        st.includes("em_andamento") ||
        st.includes("andamento") ||
        st.includes("ao_vivo") ||
        st.includes("ao vivo") ||
        st.includes("jogo") ||
        st.includes("iniciada") ||
        st.includes("iniciado") ||
        dados.ao_vivo === true ||
        dados.partida_iniciada === true
    );
}

function descobrirQuemPontuou(pontosAntigosA, pontosAntigosB, pontosNovosA, pontosNovosB) {
    const difA = pontosNovosA - pontosAntigosA;
    const difB = pontosNovosB - pontosAntigosB;

    if (difA === 1 && difB === 0) return "A";
    if (difB === 1 && difA === 0) return "B";

    return "";
}

function resetarEvolucao(partidaId, setAtual) {
    evolucaoAtiva = false;
    evolucaoCongelada = false;
    evolucaoPartidaId = String(partidaId || "");
    evolucaoSetAtual = Number(setAtual || 1) || 1;
    evolucaoPontos = [];
    renderizarEvolucao(false);
}

function prepararEvolucaoAoVivo(dados, pA, pB, setAtual) {
    const partidaId = String(dados.partida_id || "");

    if (!partidaId) {
        evolucaoAtiva = false;
        renderizarEvolucao(false);
        return;
    }

    if (evolucaoPartidaId && evolucaoPartidaId !== partidaId) {
        resetarEvolucao(partidaId, setAtual);
    }

    if (!evolucaoPartidaId) {
        evolucaoPartidaId = partidaId;
        evolucaoSetAtual = setAtual;
    }

    if (setAtual !== evolucaoSetAtual) {
        evolucaoSetAtual = setAtual;
        evolucaoPontos = [];
        evolucaoAtiva = false;
        evolucaoCongelada = false;
    }

    if (partidaEstaFinalizada(dados)) {
        evolucaoCongelada = true;
        renderizarEvolucao(true);
        return;
    }

    if (!partidaEstaAoVivo(dados)) {
        evolucaoAtiva = false;
        renderizarEvolucao(false);
        return;
    }

    const totalAtual = pA + pB;

    /*
      Só ativa quando a tela acompanha o começo.
      Se abrir em 8x6, por exemplo, não ativa para não inventar histórico.
    */
    if (!evolucaoAtiva && evolucaoPontos.length === 0) {
        if (totalAtual === 0) {
            evolucaoAtiva = true;
        } else {
            evolucaoAtiva = false;
        }
    }

    renderizarEvolucao(evolucaoAtiva || evolucaoPontos.length > 0);
}

function registrarEvolucaoSeForPonto(dados, pAOriginal, pBOriginal, setAtual) {
    if (evolucaoCongelada) return;

    prepararEvolucaoAoVivo(dados, pAOriginal, pBOriginal, setAtual);

    if (!evolucaoAtiva) return;

    const lado = descobrirQuemPontuou(ultimosPontosA, ultimosPontosB, pAOriginal, pBOriginal);

    if (!lado) return;

    evolucaoPontos.push({
        lado: lado,
        pontos_a: pAOriginal,
        pontos_b: pBOriginal,
        set_atual: setAtual
    });

    if (evolucaoPontos.length > 50) {
        evolucaoPontos = evolucaoPontos.slice(-50);
    }
}

function renderizarLinhaVazia() {
    if (!timelineVertical) return;
    timelineVertical.innerHTML = "";
    for (let i = 0; i < 28; i++) {
        const item = document.createElement("div");
        item.className = "ponto-vertical vazio";
        item.innerHTML = `<span class="ponto-esq"></span><span class="ponto-meio"><i class="ponto-vazio-dot"></i></span><span class="ponto-dir"></span>`;
        timelineVertical.appendChild(item);
    }
    evolucaoContador.textContent = "0 pontos";
}

function renderizarEvolucao(mostrar) {
    if (!timelineVertical) return;
    if (!mostrar) {
        renderizarLinhaVazia();
        return;
    }

    timelineVertical.innerHTML = "";
    const invertido = getInvertidoVisual(ultimoEstado || {});
    const lista = evolucaoPontos.slice(-28);
    let contadorA = 0;
    let contadorB = 0;

    evolucaoContador.textContent = `${lista.length} ponto${lista.length === 1 ? "" : "s"}`;

    for (let i = 0; i < Math.max(28, lista.length); i++) {
        const ponto = lista[i];
        const item = document.createElement("div");
        item.className = "ponto-vertical vazio";

        let lado = ponto ? ponto.lado : "";
        if (invertido) {
            if (lado === "A") lado = "B";
            else if (lado === "B") lado = "A";
        }

        if (lado === "A") {
            contadorA += 1;
            item.className = "ponto-vertical ponto-a";
            item.innerHTML = `<span class="ponto-esq"><b class="ponto-marcador a">${contadorA}</b></span><span class="ponto-meio"></span><span class="ponto-dir"></span>`;
        } else if (lado === "B") {
            contadorB += 1;
            item.className = "ponto-vertical ponto-b";
            item.innerHTML = `<span class="ponto-esq"></span><span class="ponto-meio"></span><span class="ponto-dir"><b class="ponto-marcador b">${contadorB}</b></span>`;
        } else {
            item.innerHTML = `<span class="ponto-esq"></span><span class="ponto-meio"><i class="ponto-vazio-dot"></i></span><span class="ponto-dir"></span>`;
        }

        timelineVertical.appendChild(item);
    }
}

function animarSeMudou(el, novo, antigo) {
    const n = Number(novo) || 0;
    const a = Number(antigo) || 0;

    if (n !== a) {
        el.classList.remove("animar");
        void el.offsetWidth;
        el.classList.add("animar");
    }
}

function aplicarSaque(saque) {
    saqueA.classList.toggle("ativo", saque === "A");
    saqueB.classList.toggle("ativo", saque === "B");
}

function normalizarListaEvolucaoBackend(lista) {
    if (!Array.isArray(lista)) return [];
    return lista
        .map((item) => {
            if (typeof item === "string") return { lado: normalizarLado(item) };
            if (item && typeof item === "object") {
                return { lado: normalizarLado(item.lado || item.equipe || item.ponto || item.time) };
            }
            return { lado: "" };
        })
        .filter((item) => item.lado === "A" || item.lado === "B");
}

function placarPorEvolucaoBackend(dados) {
    const lista = normalizarListaEvolucaoBackend(dados && dados.evolucao_pontos);
    if (!lista.length) return null;
    let a = 0;
    let b = 0;
    lista.forEach((p) => {
        if (p.lado === "A") a++;
        if (p.lado === "B") b++;
    });
    return { a, b, total: a + b, lista };
}

function aplicarEvolucaoBackendSeVier(dados, setAtual) {
    const calc = placarPorEvolucaoBackend(dados);
    if (!calc || !calc.lista.length) return;

    evolucaoPartidaId = String(dados.partida_id || evolucaoPartidaId || "");
    evolucaoSetAtual = setAtual;
    evolucaoPontos = calc.lista.slice(-50).map((p) => ({
        lado: p.lado,
        set_atual: setAtual
    }));
    evolucaoAtiva = true;
    evolucaoCongelada = partidaEstaFinalizada(dados);
}

function aplicarEstado(dados) {
    if (!dados || typeof dados !== "object") return;

    ultimoEstado = dados;
    telao.classList.remove("sem-jogo");

    const invertido = getInvertidoVisual(dados);

    let equipeA = nomeEquipeA(dados);
    let equipeB = nomeEquipeB(dados);

    let pAOriginal = Number(dados.pontos_a ?? dados.placar_a ?? 0) || 0;
    let pBOriginal = Number(dados.pontos_b ?? dados.placar_b ?? 0) || 0;

    const placarEventos = placarPorEvolucaoBackend(dados);
    if (placarEventos && placarEventos.total > (pAOriginal + pBOriginal)) {
        pAOriginal = placarEventos.a;
        pBOriginal = placarEventos.b;
    }

    let pA = pAOriginal;
    let pB = pBOriginal;

    let sA = Number(dados.sets_a ?? 0) || 0;
    let sB = Number(dados.sets_b ?? 0) || 0;

    let saque = normalizarLado(dados.saque_atual || dados.saque);
    const setAtual = Number(dados.set_atual || 1) || 1;

    aplicarEvolucaoBackendSeVier(dados, setAtual);
    if (!Array.isArray(dados.evolucao_pontos) || !dados.evolucao_pontos.length) {
        registrarEvolucaoSeForPonto(dados, pAOriginal, pBOriginal, setAtual);
    }

    if (invertido) {
        [equipeA, equipeB] = [equipeB, equipeA];
        [pA, pB] = [pB, pA];
        [sA, sB] = [sB, sA];

        if (saque === "A") saque = "B";
        else if (saque === "B") saque = "A";
    }

    animarSeMudou(pontosA, pA, ultimosPontosA);
    animarSeMudou(pontosB, pB, ultimosPontosB);

    ultimosPontosA = pAOriginal;
    ultimosPontosB = pBOriginal;

    let escA = dados.escudo_a_operacional || dados.escudo_a || dados.escudoA || "/static/img/escudo_padrao.svg";
    let escB = dados.escudo_b_operacional || dados.escudo_b || dados.escudoB || "/static/img/escudo_padrao.svg";
    let corA = dados.cor_a_operacional || dados.cor_a || dados.corA || "#2E6BE6";
    let corB = dados.cor_b_operacional || dados.cor_b || dados.corB || "#E53935";

    if (invertido) {
        [escA, escB] = [escB, escA];
        [corA, corB] = [corB, corA];
    }

    nomeA.textContent = equipeA;
    nomeB.textContent = equipeB;
    labelVerticalA.textContent = equipeA.substring(0, 1).toUpperCase() || "A";
    labelVerticalB.textContent = equipeB.substring(0, 1).toUpperCase() || "B";
    escudoA.src = escA;
    escudoB.src = escB;
    document.documentElement.style.setProperty("--cor-a", corA);
    document.documentElement.style.setProperty("--cor-b", corB);

    pontosA.textContent = pA;
    pontosB.textContent = pB;

    setsA.textContent = sA;
    setsB.textContent = sB;

    setAtualEl.textContent = `${setAtual}º SET`;

    aplicarSaque(saque);

    const competicao = dados.competicao || "";
    if (competicao) {
        infoJogo.textContent = `${competicao} • ${setAtual}º SET`;
    } else if (apontador) {
        infoJogo.textContent = `TELÃO ${apontador} • AGUARDANDO JOGO`;
    } else {
        infoJogo.textContent = `${setAtual}º SET`;
    }

    renderizarEvolucao(evolucaoAtiva || evolucaoPontos.length > 0 || evolucaoCongelada);
}

if (ESTADO_INICIAL && typeof ESTADO_INICIAL === "object" && Object.keys(ESTADO_INICIAL).length) {
    aplicarEstado(ESTADO_INICIAL);
} else {
    renderizarLinhaVazia();
}

socket.on("placar_apontador_atualizado", aplicarEstado);
</script>
</body>
</html>
