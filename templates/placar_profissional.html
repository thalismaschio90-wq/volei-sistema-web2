<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placar ao Vivo</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>

:root {
    --text: #f8fafc;
    --gold: #F6C945;
    --cor-a: #0B54E8;
    --cor-b: #111111;
    --cor-a-glow: rgba(32, 132, 255, .55);
    --cor-b-glow: rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at 16% 15%, color-mix(in srgb, var(--cor-a) 30%, transparent), transparent 32%),
        radial-gradient(circle at 84% 15%, color-mix(in srgb, var(--cor-b) 28%, transparent), transparent 34%),
        linear-gradient(135deg, #07111f 0%, #101827 44%, #070b12 100%);
}
.telao {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: 66px minmax(0, 1fr);
    gap: 12px;
    padding: 14px 20px 18px;
}
.topo {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
}
.status {
    justify-self: center;
    min-width: min(940px, 64vw);
    max-width: 1040px;
    padding: 10px 28px;
    border: 2px solid rgba(255,255,255,.30);
    border-radius: 999px;
    background: rgba(0,0,0,.46);
    color: #fff;
    text-align: center;
    font-size: clamp(22px, 2vw, 34px);
    font-weight: 1000;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: 0 0 26px rgba(40,150,255,.18), inset 0 0 0 1px rgba(255,255,255,.10);
}
.btn-inverter {
    justify-self: end;
    border: 2px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.48);
    color: #fff;
    border-radius: 999px;
    padding: 11px 17px;
    font-size: 13px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 14px 30px rgba(0,0,0,.22);
}
.miolo {
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px minmax(0, 1fr);
    gap: 14px;
    align-items: stretch;
}
.equipe {
    min-width: 0;
    border-radius: 30px;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,.34);
    display: grid;
    grid-template-rows: 190px minmax(0, 1fr);
    box-shadow: 0 26px 70px rgba(0,0,0,.38);
    position: relative;
}
.equipe:before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(circle at 28% 18%, rgba(255,255,255,.18), transparent 28%),
        linear-gradient(135deg, rgba(255,255,255,.08), transparent 45%),
        repeating-linear-gradient(135deg, transparent 0 22px, rgba(255,255,255,.025) 23px 24px);
    pointer-events: none;
}
.equipe-a {
    border-color: color-mix(in srgb, var(--cor-a) 62%, #fff 18%);
    background: linear-gradient(145deg, color-mix(in srgb, var(--cor-a) 94%, #061629 6%), color-mix(in srgb, var(--cor-a) 62%, #020817 38%));
    box-shadow: 0 0 22px color-mix(in srgb, var(--cor-a) 45%, transparent), 0 24px 70px rgba(0,0,0,.38);
}
.equipe-b {
    border-color: color-mix(in srgb, var(--cor-b) 58%, #fff 24%);
    background: linear-gradient(145deg, color-mix(in srgb, var(--cor-b) 96%, #ffffff 4%), color-mix(in srgb, var(--cor-b) 70%, #020817 30%));
    box-shadow: 0 0 22px color-mix(in srgb, var(--cor-b) 45%, transparent), 0 24px 70px rgba(0,0,0,.38);
}
.nome-linha {
    min-width: 0;
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 30px 112px minmax(0, 1fr);
    align-items: center;
    gap: 16px;
    padding: 22px 26px;
    overflow: hidden;
    border-bottom: 3px solid rgba(255,255,255,.20);
    background: rgba(0,0,0,.16);
}
.nome-linha.direita {
    grid-template-columns: minmax(0, 1fr) 112px 30px;
    text-align: right;
    overflow: hidden;
}
.bolinha-saque {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    background: rgba(255,255,255,.20);
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.20);
    transition: box-shadow .28s ease, transform .28s ease, opacity .28s ease, filter .28s ease;
}
.bolinha-saque.ativo {
    background-image: url('/static/img/bola_volei.png');
    background-color: transparent;
    box-shadow: 0 0 0 8px rgba(246,201,69,.14), 0 0 34px rgba(246,201,69,.95);
    transform: scale(1.12);
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.35));
}
.bolinha-saque.saindo {
    opacity: .22;
    transform: scale(.76);
}
#saqueAnimador {
    position: fixed;
    left: 0;
    top: 0;
    width: 34px;
    height: 34px;
    border-radius: 999px;
    background-image: url('/static/img/bola_volei.png');
    background-position: center;
    background-repeat: no-repeat;
    background-size: contain;
    filter: drop-shadow(0 8px 14px rgba(0,0,0,.35));
    box-shadow: 0 0 0 8px rgba(246,201,69,.14), 0 0 34px rgba(246,201,69,.95);
    pointer-events: none;
    opacity: 0;
    z-index: 9999;
    transform: translate3d(-999px, -999px, 0) scale(1);
    transition: transform .52s cubic-bezier(.22, 1, .36, 1), opacity .18s ease;
}
#saqueAnimador.mostrar { opacity: 1; }
.escudo-telao {
    width: 104px;
    height: 104px;
    object-fit: contain;
    border-radius: 24px;
    background: rgba(255,255,255,.14);
    padding: 9px;
    filter: drop-shadow(0 16px 28px rgba(0,0,0,.36));
}
.nome-linha > div { min-width: 0; overflow: hidden; }
.nome-equipe {
    min-width: 0;
    font-size: clamp(34px, 3.2vw, 64px);
    line-height: .94;
    font-weight: 1000;
    text-transform: uppercase;
    letter-spacing: -.045em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 0 10px 22px rgba(0,0,0,.38);
}
.pontos {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 24px;
    font-size: clamp(300px, 27vw, 520px);
    line-height: .78;
    font-weight: 1000;
    letter-spacing: -.085em;
    color: #fff;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 22px 40px rgba(0,0,0,.32);
    perspective: 900px;
    transform-style: preserve-3d;
    overflow: visible;
}
.pontos.animar { animation: virarPaginaPlacar .58s cubic-bezier(.2,.85,.25,1); }
.pontos.animar::after {
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    top: 10%;
    height: 48%;
    border-radius: 28px 28px 12px 12px;
    background: linear-gradient(180deg, rgba(255,255,255,.24), rgba(255,255,255,0));
    transform-origin: bottom center;
    animation: brilhoPaginaPlacar .58s cubic-bezier(.2,.85,.25,1);
    pointer-events: none;
}
@keyframes virarPaginaPlacar {
    0% { transform: rotateX(0deg) scale(1); filter: brightness(1); }
    42% { transform: rotateX(-72deg) scale(.985); filter: brightness(1.20); }
    100% { transform: rotateX(0deg) scale(1); filter: brightness(1); }
}
@keyframes brilhoPaginaPlacar {
    0% { opacity: 0; transform: rotateX(0deg); }
    38% { opacity: .95; transform: rotateX(-58deg); }
    100% { opacity: 0; transform: rotateX(0deg); }
}
.centro-vertical {
    min-width: 0;
    display: grid;
    grid-template-rows: 174px minmax(0, 1fr);
    gap: 10px;
}
.sets-box,
.evolucao-vertical {
    border: 2px solid rgba(15,47,74,.15);
    border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(245,248,252,.94));
    box-shadow: 0 20px 48px rgba(0,0,0,.24), inset 0 0 0 1px rgba(255,255,255,.65);
    color: #10283d;
}
.sets-box {
    padding: 13px 18px;
    text-align: center;
}
.set-label,
.evolucao-titulo {
    color: #0f2f4a;
    font-size: 20px;
    font-weight: 1000;
    letter-spacing: .08em;
    text-transform: uppercase;
}
.sets-valor {
    margin: 10px 0 8px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 14px;
}
.set-num {
    height: 62px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    line-height: 1;
    font-weight: 1000;
    color: #fff;
    font-variant-numeric: tabular-nums;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.22), 0 10px 20px rgba(0,0,0,.14);
}
.set-a { background: var(--cor-a); }
.set-b { background: var(--cor-b); }
.set-x { font-size: 32px; font-weight: 1000; color: #0b1320; }
.set-atual {
    display: inline-flex;
    justify-content: center;
    min-width: 132px;
    border: 2px solid rgba(246,201,69,.72);
    background: rgba(246,201,69,.18);
    border-radius: 999px;
    padding: 8px 18px;
    color: #8a6500;
    font-size: 19px;
    font-weight: 1000;
    letter-spacing: .06em;
    text-transform: uppercase;
}
.evolucao-vertical {
    min-height: 0;
    padding: 12px 16px 14px;
    display: grid;
    grid-template-rows: 34px 28px minmax(0, 1fr);
    gap: 8px;
    overflow: hidden;
}
.evolucao-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
}
.evolucao-contador {
    color: rgba(15,47,74,.70);
    font-size: 13px;
    font-weight: 1000;
    white-space: nowrap;
}
.evolucao-legenda {
    display: grid;
    grid-template-columns: 1fr 28px 1fr;
    gap: 6px;
    align-items: center;
    color: rgba(15,47,74,.78);
    font-size: 16px;
    font-weight: 1000;
    text-transform: uppercase;
}
.evolucao-legenda .lado-a { text-align: center; color: var(--cor-a); }
.evolucao-legenda .lado-b { text-align: center; color: var(--cor-b); }
.evolucao-legenda .meio { text-align: center; opacity: .60; }
.timeline-vertical {
    min-height: 0;
    overflow: hidden;
    display: grid;
    grid-template-rows: repeat(10, minmax(0, 1fr));
    gap: 5px;
    padding: 2px 8px 0;
}
.ponto-vertical {
    display: grid;
    grid-template-columns: 1fr 30px 1fr;
    align-items: center;
    gap: 8px;
    min-height: 0;
    height: 100%;
    font-weight: 1000;
}
.ponto-vertical > span {
    min-height: 0;
    height: 100%;
    display: flex;
    align-items: center;
}
.ponto-vertical .ponto-esq { justify-content: flex-end; }
.ponto-vertical .ponto-dir { justify-content: flex-start; }
.ponto-vertical .ponto-meio { justify-content: center; opacity: .20; }
.ponto-marcador {
    width: 28px;
    height: 28px;
    border-radius: 999px;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    color: #fff;
    font-size: 16px;
    font-weight: 1000;
    line-height: 1;
    box-shadow: 0 8px 18px rgba(15,47,74,.22);
}
.ponto-marcador.a { background: var(--cor-a); }
.ponto-marcador.b { background: var(--cor-b); }
.ponto-vazio-dot {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    background: rgba(15,47,74,.08);
    display: inline-block;
}
.ponto-vertical.vazio { opacity: .65; }
.sem-jogo .equipe { opacity: .86; }
@media (max-width: 1200px) {
    .miolo { grid-template-columns: minmax(0,1fr) 280px minmax(0,1fr); }
    .equipe { grid-template-rows: 150px minmax(0,1fr); }
    .nome-linha { grid-template-columns: 24px 94px minmax(0,1fr); padding: 18px 22px; gap: 12px; }
    .nome-linha.direita { grid-template-columns: minmax(0,1fr) 94px 24px; }
    .escudo-telao { width: 90px; height: 90px; border-radius: 20px; }
    .nome-equipe { font-size: clamp(34px, 3.5vw, 62px); }
    .pontos { font-size: clamp(210px, 24vw, 360px); }
    .footer-value { font-size: 14px; }
}


/* Ajuste final: ponto a ponto compacto, sempre dentro da tela */
.evolucao-titulo {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.evolucao-head { min-width: 0; }
.evolucao-head > * { min-width: 0; }
.timeline-vertical {
    grid-template-rows: repeat(10, 1fr);
}
.ponto-vertical {
    overflow: visible;
}
@media (max-height: 760px) {
    .telao { grid-template-rows: 58px minmax(0, 1fr); padding: 10px 14px 12px; gap: 8px; }
    .status { font-size: 22px; padding: 8px 20px; }
    .miolo { grid-template-columns: minmax(0,1fr) 330px minmax(0,1fr); gap: 10px; }
    .centro-vertical { grid-template-rows: 154px minmax(0, 1fr); gap: 8px; }
    .sets-box { padding: 10px 14px; }
    .set-label, .evolucao-titulo { font-size: 17px; }
    .sets-valor { margin: 7px 0 5px; }
    .set-num { height: 54px; font-size: 42px; }
    .set-atual { font-size: 17px; padding: 6px 14px; }
    .evolucao-vertical { padding: 9px 13px 10px; grid-template-rows: 30px 24px minmax(0,1fr); gap: 6px; }
    .evolucao-legenda { font-size: 14px; }
    .timeline-vertical { gap: 4px; padding-top: 0; }
    .ponto-marcador { width: 24px; height: 24px; font-size: 14px; }
}

</style>
</head>
<body>
<div id="saqueAnimador" aria-hidden="true"></div>
<div id="telao" class="telao sem-jogo">
    <div class="topo">
        <div></div>
        <div class="status" id="infoJogo">AGUARDANDO JOGO AO VIVO</div>
        <button id="btnInverter" class="btn-inverter" type="button">↔ INVERTER LADOS</button>
    </div>

    <main class="miolo">
        <section id="cardA" class="equipe equipe-a">
            <div class="nome-linha">
                <span id="saqueA" class="bolinha-saque"></span>
                <img id="escudoA" class="escudo-telao" src="/static/img/escudo_padrao.svg" alt="Escudo Equipe A">
                <div>
                    <div id="nomeA" class="nome-equipe">Equipe A</div>
                </div>
            </div>
            <div id="pontosA" class="pontos">0</div>
        </section>

        <aside class="centro-vertical">
            <div class="sets-box">
                <div class="set-label">SETS</div>
                <div class="sets-valor">
                    <div id="setsA" class="set-num set-a">0</div>
                    <div class="set-x">×</div>
                    <div id="setsB" class="set-num set-b">0</div>
                </div>
                <div id="setAtual" class="set-atual">1º SET</div>
            </div>

            <section id="rodapeEvolucao" class="evolucao-vertical">
                <div class="evolucao-head">
                    <div class="evolucao-titulo">Ponto a ponto</div>
                    <div id="evolucaoContador" class="evolucao-contador">0 pontos</div>
                </div>
                <div class="evolucao-legenda">
                    <span id="labelVerticalA" class="lado-a">A</span>
                    <span class="meio">•</span>
                    <span id="labelVerticalB" class="lado-b">B</span>
                </div>
                <div id="timelineVertical" class="timeline-vertical"></div>
            </section>
        </aside>

        <section id="cardB" class="equipe equipe-b">
            <div class="nome-linha direita">
                <div>
                    <div id="nomeB" class="nome-equipe">Equipe B</div>
                </div>
                <img id="escudoB" class="escudo-telao" src="/static/img/escudo_padrao.svg" alt="Escudo Equipe B">
                <span id="saqueB" class="bolinha-saque"></span>
            </div>
            <div id="pontosB" class="pontos">0</div>
        </section>
    </main>

</div>
<script>
const apontador = {{ (apontador if apontador is defined else '') | tojson }};
const ESTADO_INICIAL = {{ (estado if estado is defined else {}) | tojson | safe }};
const socket = io();

const telao = document.getElementById("telao");
const infoJogo = document.getElementById("infoJogo");

const nomeA = document.getElementById("nomeA");
const nomeB = document.getElementById("nomeB");
const escudoA = document.getElementById("escudoA");
const escudoB = document.getElementById("escudoB");
const pontosA = document.getElementById("pontosA");
const pontosB = document.getElementById("pontosB");

const setsA = document.getElementById("setsA");
const setsB = document.getElementById("setsB");
const setAtualEl = document.getElementById("setAtual");

const saqueA = document.getElementById("saqueA");
const saqueB = document.getElementById("saqueB");
const saqueAnimador = document.getElementById("saqueAnimador");

const btnInverter = document.getElementById("btnInverter");
const rodapeEvolucao = document.getElementById("rodapeEvolucao");
const timelineVertical = document.getElementById("timelineVertical");
const evolucaoContador = document.getElementById("evolucaoContador");
const labelVerticalA = document.getElementById("labelVerticalA");
const labelVerticalB = document.getElementById("labelVerticalB");

let ultimoEstado = null;
let ultimosPontosA = null;
let ultimosPontosB = null;
let ultimoSaqueVisual = "";
let primeiraAplicacaoSaque = true;

/*
  EVOLUÇÃO PERSISTENTE:
  - A fonte principal é dados.evolucao_pontos, montada no backend pelos eventos salvos.
  - Se atualizar, sair ou voltar para a partida, o telão reconstrói a evolução pelo banco.
  - O cálculo local abaixo fica apenas como reserva enquanto o socket ainda não trouxe histórico.
*/
let evolucaoAtiva = false;
let evolucaoCongelada = false;
let evolucaoPartidaId = "";
let evolucaoSetAtual = 1;
let evolucaoPontos = [];

function chaveInversao(dados) {
    const partida = dados && dados.partida_id ? String(dados.partida_id) : "sem_partida";
    const ap = apontador || "sem_apontador";
    // Inversão exclusiva do TELÃO: não lê nem grava a inversão do apontador.
    return `telao_invertido_visual_${ap}_${partida}`;
}

function boolInversao(valor) {
    return valor === true || valor === 1 || valor === "1" || String(valor || "").toLowerCase() === "true";
}

function getInvertidoVisual(dados) {
    // 100% visual e local desta tela.
    // Não usa lados_invertidos_apontador/lados_invertidos vindos do socket,
    // para o telão não mexer e não seguir a lógica do apontador.
    return localStorage.getItem(chaveInversao(dados || {})) === "1";
}

function setInvertidoVisual(dados, valor) {
    // Salva apenas no navegador do telão. Não altera payload, banco, socket ou estado real.
    localStorage.setItem(chaveInversao(dados || {}), valor ? "1" : "0");
}

btnInverter.addEventListener("click", function () {
    const atual = getInvertidoVisual(ultimoEstado || {});
    setInvertidoVisual(ultimoEstado || {}, !atual);
    if (ultimoEstado) aplicarEstado(ultimoEstado);
});

socket.on("connect", () => {
    if (apontador) {
        socket.emit("entrar_placar_apontador", { apontador: apontador });
    }
});

socket.on("inversao_lados_apontador", () => {
    // O telão agora ignora a inversão do apontador.
    // A inversão desta tela é somente visual/local e permanece salva no localStorage.
});

window.addEventListener("storage", (ev) => {
    // Reaplica apenas quando outra aba deste mesmo telão alterar a chave visual do telão.
    if (!ev.key || !ev.key.startsWith("telao_invertido_visual_")) return;
    if (ultimoEstado) aplicarEstado(ultimoEstado);
});

function normalizarLado(valor) {
    const v = String(valor || "").trim().toUpperCase();
    if (v === "A" || v === "EQUIPE_A" || v === "AZUL") return "A";
    if (v === "B" || v === "EQUIPE_B" || v === "VERMELHO") return "B";
    return "";
}

function nomeEquipeA(dados) {
    // A tela do apontador trabalha com equipe_a_operacional/equipe_b_operacional.
    // Se usar equipe_a/equipe_b primeiro, o placar fica preso no lado inicial da tabela
    // e mostra nome de uma equipe com pontuação/saque da outra.
    return dados.equipe_a_operacional || dados.equipe_a_nome || dados.nome_a || dados.time_a || dados.equipe_a || "Equipe A";
}

function nomeEquipeB(dados) {
    return dados.equipe_b_operacional || dados.equipe_b_nome || dados.nome_b || dados.time_b || dados.equipe_b || "Equipe B";
}

function statusPartida(dados) {
    return String(
        dados.status ||
        dados.status_partida ||
        dados.fase_partida ||
        dados.situacao ||
        ""
    ).trim().toLowerCase();
}

function partidaEstaFinalizada(dados) {
    const st = statusPartida(dados);
    return (
        st.includes("finalizada") ||
        st.includes("finalizado") ||
        st.includes("encerrada") ||
        st.includes("encerrado") ||
        dados.finalizada === true ||
        dados.partida_finalizada === true
    );
}

function partidaEstaAoVivo(dados) {
    const st = statusPartida(dados);
    return (
        st.includes("em_andamento") ||
        st.includes("andamento") ||
        st.includes("ao_vivo") ||
        st.includes("ao vivo") ||
        st.includes("jogo") ||
        st.includes("iniciada") ||
        st.includes("iniciado") ||
        dados.ao_vivo === true ||
        dados.partida_iniciada === true
    );
}

function descobrirQuemPontuou(pontosAntigosA, pontosAntigosB, pontosNovosA, pontosNovosB) {
    const difA = pontosNovosA - pontosAntigosA;
    const difB = pontosNovosB - pontosAntigosB;

    if (difA === 1 && difB === 0) return "A";
    if (difB === 1 && difA === 0) return "B";

    return "";
}

function resetarEvolucao(partidaId, setAtual) {
    evolucaoAtiva = false;
    evolucaoCongelada = false;
    evolucaoPartidaId = String(partidaId || "");
    evolucaoSetAtual = Number(setAtual || 1) || 1;
    evolucaoPontos = [];
    renderizarEvolucao(false);
}

function prepararEvolucaoAoVivo(dados, pA, pB, setAtual) {
    const partidaId = String(dados.partida_id || "");

    if (!partidaId) {
        evolucaoAtiva = false;
        renderizarEvolucao(false);
        return;
    }

    if (evolucaoPartidaId && evolucaoPartidaId !== partidaId) {
        resetarEvolucao(partidaId, setAtual);
    }

    if (!evolucaoPartidaId) {
        evolucaoPartidaId = partidaId;
        evolucaoSetAtual = setAtual;
    }

    if (setAtual !== evolucaoSetAtual) {
        evolucaoSetAtual = setAtual;
        evolucaoPontos = [];
        evolucaoAtiva = false;
        evolucaoCongelada = false;
    }

    if (partidaEstaFinalizada(dados)) {
        evolucaoCongelada = true;
        renderizarEvolucao(true);
        return;
    }

    if (!partidaEstaAoVivo(dados)) {
        evolucaoAtiva = false;
        renderizarEvolucao(false);
        return;
    }

    const totalAtual = pA + pB;

    /*
      Só ativa quando a tela acompanha o começo.
      Se abrir em 8x6, por exemplo, não ativa para não inventar histórico.
    */
    if (!evolucaoAtiva && evolucaoPontos.length === 0) {
        if (totalAtual === 0) {
            evolucaoAtiva = true;
        } else {
            evolucaoAtiva = false;
        }
    }

    renderizarEvolucao(evolucaoAtiva || evolucaoPontos.length > 0);
}

function registrarEvolucaoSeForPonto(dados, pAOriginal, pBOriginal, setAtual) {
    if (evolucaoCongelada) return;

    prepararEvolucaoAoVivo(dados, pAOriginal, pBOriginal, setAtual);

    if (!evolucaoAtiva) return;

    const lado = descobrirQuemPontuou(ultimosPontosA, ultimosPontosB, pAOriginal, pBOriginal);

    if (!lado) return;

    evolucaoPontos.push({
        lado: lado,
        pontos_a: pAOriginal,
        pontos_b: pBOriginal,
        set_atual: setAtual
    });

    if (evolucaoPontos.length > 50) {
        evolucaoPontos = evolucaoPontos.slice(-50);
    }
}

function renderizarLinhaVazia() {
    if (!timelineVertical) return;
    timelineVertical.innerHTML = "";
    for (let i = 0; i < 10; i++) {
        const item = document.createElement("div");
        item.className = "ponto-vertical vazio";
        item.innerHTML = `<span class="ponto-esq"></span><span class="ponto-meio"><i class="ponto-vazio-dot"></i></span><span class="ponto-dir"></span>`;
        timelineVertical.appendChild(item);
    }
    evolucaoContador.textContent = "0 pontos";
}

function renderizarEvolucao(mostrar) {
    if (!timelineVertical) return;

    if (!mostrar || !evolucaoPontos.length) {
        renderizarLinhaVazia();
        return;
    }

    timelineVertical.innerHTML = "";
    const invertido = getInvertidoVisual(ultimoEstado || {});

    let acumuladoA = 0;
    let acumuladoB = 0;

    const historico = evolucaoPontos.map((p) => {
        const ladoOriginal = p && p.lado === "B" ? "B" : "A";

        if (ladoOriginal === "A") acumuladoA += 1;
        if (ladoOriginal === "B") acumuladoB += 1;

        const valorA = Number(p && (p.pontos_a ?? p.placar_a));
        const valorB = Number(p && (p.pontos_b ?? p.placar_b));

        const pontosA = valorA > 0 ? valorA : acumuladoA;
        const pontosB = valorB > 0 ? valorB : acumuladoB;

        acumuladoA = Math.max(acumuladoA, pontosA);
        acumuladoB = Math.max(acumuladoB, pontosB);

        return {
            ladoOriginal,
            ladoVisual: invertido ? (ladoOriginal === "A" ? "B" : "A") : ladoOriginal,
            valor: ladoOriginal === "A" ? pontosA : pontosB,
        };
    });

    // Mostra SOMENTE os últimos 10 lances. Os antigos saem da tela.
    const lista = historico.slice(-10);
    evolucaoContador.textContent = `${lista.length} ponto${lista.length === 1 ? "" : "s"}`;

    for (const ponto of lista) {
        const item = document.createElement("div");
        item.className = "ponto-vertical";

        if (ponto.ladoVisual === "A") {
            item.classList.add("ponto-a");
            item.innerHTML = `<span class="ponto-esq"><b class="ponto-marcador a">${ponto.valor}</b></span><span class="ponto-meio"></span><span class="ponto-dir"></span>`;
        } else {
            item.classList.add("ponto-b");
            item.innerHTML = `<span class="ponto-esq"></span><span class="ponto-meio"></span><span class="ponto-dir"><b class="ponto-marcador b">${ponto.valor}</b></span>`;
        }

        timelineVertical.appendChild(item);
    }

    // Completa até 10 linhas sem estourar o painel.
    for (let i = lista.length; i < 10; i++) {
        const item = document.createElement("div");
        item.className = "ponto-vertical vazio";
        item.innerHTML = `<span class="ponto-esq"></span><span class="ponto-meio"><i class="ponto-vazio-dot"></i></span><span class="ponto-dir"></span>`;
        timelineVertical.appendChild(item);
    }
}

function animarPontoReal(el) {
    if (!el) return;
    el.classList.remove("animar");
    void el.offsetWidth;
    el.classList.add("animar");
}

function descobrirLadoPontuouOriginal(pAOriginal, pBOriginal) {
    if (ultimosPontosA === null || ultimosPontosB === null) return "";

    const antigoA = Number(ultimosPontosA) || 0;
    const antigoB = Number(ultimosPontosB) || 0;
    const novoA = Number(pAOriginal) || 0;
    const novoB = Number(pBOriginal) || 0;

    const difA = novoA - antigoA;
    const difB = novoB - antigoB;

    if (difA === 1 && difB === 0) return "A";
    if (difB === 1 && difA === 0) return "B";
    return "";
}

function centroBolinha(el) {
    if (!el) return null;
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return null;
    return {
        x: r.left + (r.width / 2) - 17,
        y: r.top + (r.height / 2) - 17,
    };
}

function moverBolinhaSaque(origemEl, destinoEl) {
    if (!saqueAnimador || !destinoEl) return;

    const destino = centroBolinha(destinoEl);
    if (!destino) return;

    const origem = centroBolinha(origemEl) || destino;

    saqueAnimador.classList.remove("mostrar");
    saqueAnimador.style.transition = "none";
    saqueAnimador.style.transform = `translate3d(${origem.x}px, ${origem.y}px, 0) scale(.82)`;
    void saqueAnimador.offsetWidth;

    saqueAnimador.style.transition = "transform .52s cubic-bezier(.22, 1, .36, 1), opacity .18s ease";
    saqueAnimador.classList.add("mostrar");
    saqueAnimador.style.transform = `translate3d(${destino.x}px, ${destino.y}px, 0) scale(1.12)`;

    window.setTimeout(() => {
        saqueAnimador.style.transform = `translate3d(${destino.x}px, ${destino.y}px, 0) scale(1)`;
    }, 420);

    window.setTimeout(() => {
        saqueAnimador.classList.remove("mostrar");
    }, 680);
}

function aplicarSaque(saque) {
    const novoSaque = saque === "A" || saque === "B" ? saque : "";
    const origemEl = ultimoSaqueVisual === "A" ? saqueA : (ultimoSaqueVisual === "B" ? saqueB : null);
    const destinoEl = novoSaque === "A" ? saqueA : (novoSaque === "B" ? saqueB : null);

    if (!primeiraAplicacaoSaque && novoSaque && novoSaque !== ultimoSaqueVisual) {
        if (origemEl) origemEl.classList.add("saindo");
        moverBolinhaSaque(origemEl, destinoEl);
        window.setTimeout(() => {
            saqueA.classList.remove("saindo");
            saqueB.classList.remove("saindo");
        }, 560);
    }

    saqueA.classList.toggle("ativo", novoSaque === "A");
    saqueB.classList.toggle("ativo", novoSaque === "B");

    ultimoSaqueVisual = novoSaque;
    primeiraAplicacaoSaque = false;
}

function normalizarListaEvolucaoBackend(lista) {
    if (!Array.isArray(lista)) return [];
    return lista
        .map((item) => {
            if (typeof item === "string") return { lado: normalizarLado(item) };
            if (item && typeof item === "object") {
                return {
                    lado: normalizarLado(item.lado || item.equipe || item.ponto || item.time),
                    pontos_a: item.pontos_a ?? item.placar_a,
                    pontos_b: item.pontos_b ?? item.placar_b,
                };
            }
            return { lado: "" };
        })
        .filter((item) => item.lado === "A" || item.lado === "B");
}

function placarPorEvolucaoBackend(dados) {
    const lista = normalizarListaEvolucaoBackend(dados && dados.evolucao_pontos);
    if (!lista.length) return null;
    let a = 0;
    let b = 0;
    lista.forEach((p) => {
        if (p.lado === "A") a++;
        if (p.lado === "B") b++;
    });
    return { a, b, total: a + b, lista };
}

function aplicarEvolucaoBackendSeVier(dados, setAtual) {
    const calc = placarPorEvolucaoBackend(dados);
    if (!calc || !calc.lista.length) return;

    evolucaoPartidaId = String(dados.partida_id || evolucaoPartidaId || "");
    evolucaoSetAtual = setAtual;
    evolucaoPontos = calc.lista.slice(-50).map((p) => ({
        lado: p.lado,
        pontos_a: p.pontos_a,
        pontos_b: p.pontos_b,
        set_atual: setAtual
    }));
    evolucaoAtiva = true;
    evolucaoCongelada = partidaEstaFinalizada(dados);
}

function aplicarEstado(dados) {
    if (!dados || typeof dados !== "object") return;

    ultimoEstado = dados;
    telao.classList.remove("sem-jogo");

    const invertido = getInvertidoVisual(dados);

    let equipeA = nomeEquipeA(dados);
    let equipeB = nomeEquipeB(dados);

    let pAOriginal = Number(dados.pontos_a ?? dados.placar_a ?? 0) || 0;
    let pBOriginal = Number(dados.pontos_b ?? dados.placar_b ?? 0) || 0;

    const placarEventos = placarPorEvolucaoBackend(dados);
    if (placarEventos && placarEventos.total > (pAOriginal + pBOriginal)) {
        pAOriginal = placarEventos.a;
        pBOriginal = placarEventos.b;
    }

    let pA = pAOriginal;
    let pB = pBOriginal;

    let sA = Number(dados.sets_a ?? 0) || 0;
    let sB = Number(dados.sets_b ?? 0) || 0;

    let saque = normalizarLado(dados.saque_atual || dados.saque);
    const setAtual = Number(dados.set_atual || 1) || 1;

    aplicarEvolucaoBackendSeVier(dados, setAtual);
    if (!Array.isArray(dados.evolucao_pontos) || !dados.evolucao_pontos.length) {
        registrarEvolucaoSeForPonto(dados, pAOriginal, pBOriginal, setAtual);
    }

    const ladoPontuouOriginal = descobrirLadoPontuouOriginal(pAOriginal, pBOriginal);

    if (invertido) {
        [equipeA, equipeB] = [equipeB, equipeA];
        [pA, pB] = [pB, pA];
        [sA, sB] = [sB, sA];

        if (saque === "A") saque = "B";
        else if (saque === "B") saque = "A";
    }

    // Anima SOMENTE quando entrou ponto novo de verdade.
    // Re-render de socket, F5, reconnect, inversão visual ou troca de nome/escudo não anima o placar.
    if (ladoPontuouOriginal) {
        const ladoPontuouVisual = invertido ? (ladoPontuouOriginal === "A" ? "B" : "A") : ladoPontuouOriginal;
        if (ladoPontuouVisual === "A") animarPontoReal(pontosA);
        if (ladoPontuouVisual === "B") animarPontoReal(pontosB);
    }

    ultimosPontosA = pAOriginal;
    ultimosPontosB = pBOriginal;

    let escA = dados.escudo_a_operacional || dados.escudo_a || dados.escudoA || "/static/img/escudo_padrao.svg";
    let escB = dados.escudo_b_operacional || dados.escudo_b || dados.escudoB || "/static/img/escudo_padrao.svg";
    let corA = dados.cor_a_operacional || dados.cor_a || dados.corA || "#2E6BE6";
    let corB = dados.cor_b_operacional || dados.cor_b || dados.corB || "#E53935";

    if (invertido) {
        [escA, escB] = [escB, escA];
        [corA, corB] = [corB, corA];
    }

    nomeA.textContent = equipeA;
    nomeB.textContent = equipeB;
    labelVerticalA.textContent = equipeA.substring(0, 1).toUpperCase() || "A";
    labelVerticalB.textContent = equipeB.substring(0, 1).toUpperCase() || "B";
    escudoA.src = escA;
    escudoB.src = escB;
    document.documentElement.style.setProperty("--cor-a", corA);
    document.documentElement.style.setProperty("--cor-b", corB);

    pontosA.textContent = pA;
    pontosB.textContent = pB;

    setsA.textContent = sA;
    setsB.textContent = sB;

    setAtualEl.textContent = `${setAtual}º SET`;

    aplicarSaque(saque);

    const competicao = dados.competicao || "";
    if (competicao) {
        infoJogo.textContent = `${competicao} • ${setAtual}º SET`;
    } else if (apontador) {
        infoJogo.textContent = `TELÃO ${apontador} • AGUARDANDO JOGO`;
    } else {
        infoJogo.textContent = `${setAtual}º SET`;
    }


    renderizarEvolucao(evolucaoAtiva || evolucaoPontos.length > 0 || evolucaoCongelada);
}

if (ESTADO_INICIAL && typeof ESTADO_INICIAL === "object" && Object.keys(ESTADO_INICIAL).length) {
    aplicarEstado(ESTADO_INICIAL);
} else {
    renderizarLinhaVazia();
}

socket.on("placar_apontador_atualizado", aplicarEstado);
</script>
