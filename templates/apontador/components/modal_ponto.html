<div id="ponto-modal-fundo" class="ponto-modal-fundo">
    <div class="ponto-modal">
        <div style="font-size:18px; font-weight:900; color:#183247;">Justificativa do ponto</div>
        <div id="ponto-equipe-texto" style="margin-top:6px; font-size:14px; color:#5c6b78;"></div>

        <div class="ponto-bloco">
            <div class="ponto-label">1. O que aconteceu?</div>
            <div id="ponto-fundamento-lista" class="ponto-lista"></div>
        </div>

        <div id="ponto-resultado-bloco" class="ponto-bloco" style="display:none;">
            <div class="ponto-label">2. Qual foi o lance?</div>
            <div id="ponto-resultado-lista" class="ponto-lista"></div>
        </div>

        <div id="ponto-tipo-erro-bloco" class="ponto-bloco" style="display:none;">
            <div class="ponto-label">3. Detalhe do lance</div>
            <div id="ponto-tipo-erro-lista" class="ponto-lista"></div>
        </div>

        <div id="ponto-atleta-bloco" class="ponto-bloco" style="display:none;">
            <div id="ponto-atleta-label" class="ponto-label">4. Quem fez?</div>
            <div id="ponto-atleta-lista" class="ponto-lista"></div>
        </div>

        <div id="ponto-resumo" class="ponto-resumo">Escolha primeiro se foi ponto, erro ou falta.</div>

        <div class="ponto-atalhos">
            Atalhos: P ponto • E erro • F falta • 1/2/3 escolhem a opção visível • Enter confirma • Esc cancela
        </div>

        <div class="ponto-acoes">
            <button id="btn-ponto-cancelar" class="btn-secundario" type="button">Cancelar</button>
            <button id="btn-ponto-confirmar" class="btn-padrao" type="button">Confirmar</button>
        </div>
    </div>
</div>
