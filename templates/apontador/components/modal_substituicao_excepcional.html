<div id="subex-modal-fundo" class="substituicao-modal-fundo">
    <div class="substituicao-modal">
        <div style="font-size:18px; font-weight:900; color:#183247;">Substituição excepcional</div>
        <div id="subex-equipe-texto" style="margin-top:6px; font-size:14px; color:#5c6b78;"></div>
        <div class="substituicao-bloco">
            <div class="substituicao-label">Sai da quadra</div>
            <div id="subex-sai-lista" class="substituicao-lista"></div>
        </div>
        <div class="substituicao-bloco">
            <div class="substituicao-label">Entra excepcionalmente</div>
            <div id="subex-entra-lista" class="substituicao-lista"></div>
        </div>
        <div class="substituicao-bloco">
            <div class="substituicao-label">Motivo</div>
            <input id="subex-motivo" type="text" style="width:100%; padding:10px; border:1px solid #d6e2f0; border-radius:10px;" placeholder="Ex.: lesão, sangramento, indisposição">
        </div>
        <div id="subex-resumo" class="substituicao-resumo">Selecione equipe, quem sai e quem entra.</div>
        <div class="substituicao-acoes">
            <button id="btn-subex-cancelar" class="btn-secundario" type="button">Cancelar</button>
            <button id="btn-subex-confirmar" class="btn-padrao" type="button">Confirmar</button>
        </div>
    </div>
</div>
