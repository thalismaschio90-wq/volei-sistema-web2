{% extends "base.html" %}

{% block titulo %}Offline do Apontador{% endblock %}

{% block conteudo %}
<style>
.offline-wrap { max-width:980px; margin:0 auto; }
.offline-hero { background:linear-gradient(135deg,#123852,#071827); color:white; border-radius:24px; padding:22px; margin-bottom:16px; box-shadow:0 18px 45px rgba(18,56,82,.18); }
.offline-hero h1 { margin:0; font-size:clamp(26px,4vw,42px); font-weight:1000; }
.offline-hero p { margin:8px 0 0; color:rgba(255,255,255,.78); font-weight:800; }
.offline-card { background:white; border:1px solid var(--border); border-radius:20px; padding:16px; box-shadow:var(--shadow); margin-bottom:12px; }
.offline-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:14px; }
.offline-kpi { border:1px solid var(--border); border-radius:16px; padding:14px; background:#f8fbff; }
.offline-kpi strong { display:block; font-size:28px; color:#d4a62a; line-height:1; }
.offline-kpi span { display:block; margin-top:6px; color:var(--muted); font-weight:800; font-size:13px; }
.offline-lista { display:grid; gap:10px; margin-top:12px; }
.offline-partida { border:1px solid var(--border); border-radius:16px; padding:14px; background:#fff; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; }
.offline-partida strong { color:#0f2f4a; font-size:16px; }
.offline-meta { color:var(--muted); font-weight:800; font-size:13px; margin-top:4px; }
.offline-acoes { display:flex; gap:8px; flex-wrap:wrap; }
.offline-btn { border:0; border-radius:12px; padding:10px 14px; font-weight:900; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
.offline-btn-primary { background:#0f766e; color:#fff; }
.offline-btn-dark { background:#111827; color:#fff; }
.offline-btn-gold { background:#d4a62a; color:#071827; }
.offline-btn-danger { background:#991b1b; color:#fff; }
.offline-alerta { border:1px solid #fdba74; background:#fff7ed; color:#9a3412; border-radius:16px; padding:14px; font-weight:850; }
.offline-ok { border:1px solid #86efac; background:#ecfdf5; color:#166534; border-radius:16px; padding:14px; font-weight:900; }
.offline-scoreboard { display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:stretch; margin-top:14px; }
.offline-team { border:1px solid var(--border); background:#f8fbff; border-radius:18px; padding:16px; display:flex; flex-direction:column; justify-content:space-between; gap:12px; }
.offline-team h2 { margin:0; color:#0f2f4a; font-size:clamp(18px,3vw,28px); }
.offline-score { font-size:clamp(54px,12vw,110px); font-weight:1000; line-height:.9; color:#0f2f4a; text-align:center; }
.offline-center { display:flex; align-items:center; justify-content:center; color:#64748b; font-weight:1000; font-size:22px; }
.offline-controls { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:14px; }
.offline-actions-bar { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
.offline-mini-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:10px; }
.offline-mini { border:1px solid var(--border); background:#fff; border-radius:14px; padding:10px; font-weight:850; color:#0f2f4a; }
.offline-history { display:grid; gap:8px; margin-top:12px; max-height:260px; overflow:auto; }
.offline-history-item { border:1px solid #dbe3ef; background:#f8fafc; border-radius:12px; padding:9px 10px; color:#183247; font-weight:800; font-size:13px; }
@media (max-width:780px) { .offline-grid, .offline-controls, .offline-mini-grid { grid-template-columns:1fr; } .offline-scoreboard { grid-template-columns:1fr; } .offline-center { display:none; } .offline-partida { align-items:flex-start; } .offline-acoes, .offline-btn { width:100%; } }
</style>

<div class="offline-wrap">
    <div class="offline-hero">
        <h1>📦 Modo Offline do Apontador</h1>
        <p>Abra e opere partidas baixadas neste dispositivo mesmo sem internet.</p>
    </div>

    <div id="offline-conteudo" class="offline-card">
        Carregando dados offline deste dispositivo...
    </div>
</div>

<script>
(function () {
    const DB_NOME = "voleitable_offline_db";
    const DB_VERSAO = 4;
    const STORE_PACOTES = "pacotes";
    const STORE_PARTIDAS = "partidas";
    const STORE_FILAS = "filas";
    const SESSION_KEY = "voleitable_offline_sessao";
    const LOCAL_PARTIDAS_KEY = "voleitable_offline_partidas";
    const LOCAL_FILA_KEY = "voleitable_offline_fila_acoes";

    function lerJson(chave, padrao) {
        try { return JSON.parse(localStorage.getItem(chave) || "") || padrao; }
        catch (e) { return padrao; }
    }

    function salvarJson(chave, valor) {
        localStorage.setItem(chave, JSON.stringify(valor));
    }

    function abrirBancoOffline() {
        return new Promise((resolve, reject) => {
            if (!("indexedDB" in window)) {
                reject(new Error("IndexedDB não disponível."));
                return;
            }
            const req = indexedDB.open(DB_NOME, DB_VERSAO);
            req.onupgradeneeded = function (event) {
                const db = event.target.result;
                if (!db.objectStoreNames.contains(STORE_PACOTES)) db.createObjectStore(STORE_PACOTES, { keyPath: "competicao" });
                if (!db.objectStoreNames.contains(STORE_PARTIDAS)) db.createObjectStore(STORE_PARTIDAS, { keyPath: "id" });
                if (!db.objectStoreNames.contains(STORE_FILAS)) db.createObjectStore(STORE_FILAS, { keyPath: "id" });
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error || new Error("Erro ao abrir banco offline."));
        });
    }

    async function listarStore(storeName) {
        const db = await abrirBancoOffline();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, "readonly");
            const req = tx.objectStore(storeName).getAll();
            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => reject(req.error || new Error("Erro ao ler offline."));
            tx.oncomplete = () => db.close();
        });
    }

    async function salvarStore(storeName, valor) {
        const db = await abrirBancoOffline();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, "readwrite");
            tx.objectStore(storeName).put(valor);
            tx.oncomplete = () => { db.close(); resolve(true); };
            tx.onerror = () => { db.close(); reject(tx.error || new Error("Erro ao salvar offline.")); };
        });
    }

    function htmlSeguro(texto) {
        return String(texto ?? "").replace(/[&<>'"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
    }

    function normalizarId(id) { return String(id || ""); }

    function partidaFinalizada(p) {
        const status = String((p && (p.status_jogo || p.status)) || "").trim().toLowerCase();
        return ["finalizada", "finalizado", "encerrada", "encerrado"].includes(status);
    }

    function ordenarPartidas(lista) {
        return (lista || [])
            .filter(p => p && !partidaFinalizada(p))
            .map(p => Object.assign({}, p, { id: normalizarId(p.id) }))
            .filter(p => p.id)
            .sort((a,b) => (Number(a.ordem || 0) - Number(b.ordem || 0)) || (Number(a.id || 0) - Number(b.id || 0)));
    }

    function deduplicarPartidas(...listas) {
        const mapa = new Map();
        listas.flat().forEach(p => {
            if (!p || partidaFinalizada(p)) return;
            const id = normalizarId(p.id);
            if (!id) return;
            mapa.set(id, Object.assign({}, mapa.get(id) || {}, p, { id }));
        });
        return ordenarPartidas(Array.from(mapa.values()));
    }

    async function carregarBaseOffline() {
        const sessao = lerJson(SESSION_KEY, null);
        const pacotes = await listarStore(STORE_PACOTES).catch(() => []);
        const partidasStore = await listarStore(STORE_PARTIDAS).catch(() => []);
        const partidasLocalObj = lerJson(LOCAL_PARTIDAS_KEY, {});
        const partidasLocal = Object.values(partidasLocalObj || {});
        const pacotePreferido = pacotes.find(p => sessao && p.competicao === sessao.competicao) || pacotes[0] || {};
        const partidasPacote = Array.isArray(pacotePreferido.partidas) ? pacotePreferido.partidas : [];
        const partidas = deduplicarPartidas(partidasStore, partidasLocal, partidasPacote);
        return { sessao, pacotes, pacote: pacotePreferido, partidas };
    }

    function chaveEstado(partidaId) {
        return `voleitable_offline_estado_partida_${normalizarId(partidaId)}`;
    }

    function obterNomeA(p) {
        return p.equipe_a_operacional || p.equipe_a || "Equipe A";
    }

    function obterNomeB(p) {
        return p.equipe_b_operacional || p.equipe_b || "Equipe B";
    }

    function estadoInicialPartida(partida, pacote) {
        const id = normalizarId(partida.id);
        const salvo = lerJson(chaveEstado(id), null);
        if (salvo) return salvo;

        const estadoBanco = (pacote.estados && pacote.estados[id]) || {};
        return {
            partida_id: id,
            competicao: partida.competicao || pacote.competicao || "",
            equipe_a: estadoBanco.equipe_a_operacional || estadoBanco.equipe_a || obterNomeA(partida),
            equipe_b: estadoBanco.equipe_b_operacional || estadoBanco.equipe_b || obterNomeB(partida),
            pontos_a: Number(estadoBanco.pontos_a ?? partida.pontos_a ?? 0) || 0,
            pontos_b: Number(estadoBanco.pontos_b ?? partida.pontos_b ?? 0) || 0,
            sets_a: Number(estadoBanco.sets_a ?? partida.sets_a ?? 0) || 0,
            sets_b: Number(estadoBanco.sets_b ?? partida.sets_b ?? 0) || 0,
            set_atual: Number(estadoBanco.set_atual ?? partida.set_atual ?? 1) || 1,
            status_offline: "em_operacao_offline",
            historico: [],
            atualizado_em: new Date().toISOString()
        };
    }

    function salvarEstadoPartida(estado) {
        estado.atualizado_em = new Date().toISOString();
        salvarJson(chaveEstado(estado.partida_id), estado);
    }

    async function salvarAcaoFila(acao) {
        const fila = lerJson(LOCAL_FILA_KEY, []);
        fila.push(acao);
        salvarJson(LOCAL_FILA_KEY, fila);
        try { await salvarStore(STORE_FILAS, acao); } catch (e) { console.warn("Não salvou fila no IndexedDB", e); }
    }

    async function registrarPontoOffline(lado) {
        const id = normalizarId(location.hash.replace("#partida=", ""));
        if (!id) return;
        const base = await carregarBaseOffline();
        const partida = base.partidas.find(p => normalizarId(p.id) === id);
        if (!partida) return;
        const estado = estadoInicialPartida(partida, base.pacote);

        const ladoNorm = String(lado || "").toUpperCase() === "B" ? "B" : "A";
        if (ladoNorm === "A") estado.pontos_a = Number(estado.pontos_a || 0) + 1;
        else estado.pontos_b = Number(estado.pontos_b || 0) + 1;

        const acao = {
            id: `${Date.now()}_${Math.random().toString(36).slice(2)}`,
            tipo: "ponto",
            lado: ladoNorm,
            partida_id: id,
            competicao: estado.competicao,
            pontos_a: estado.pontos_a,
            pontos_b: estado.pontos_b,
            criado_em: new Date().toISOString(),
            sincronizado: false
        };

        estado.historico = Array.isArray(estado.historico) ? estado.historico : [];
        estado.historico.unshift(acao);
        estado.historico = estado.historico.slice(0, 80);
        salvarEstadoPartida(estado);
        await salvarAcaoFila(acao);
        renderPartidaOffline(id);
    }

    async function desfazerOffline() {
        const id = normalizarId(location.hash.replace("#partida=", ""));
        if (!id) return;
        const base = await carregarBaseOffline();
        const partida = base.partidas.find(p => normalizarId(p.id) === id);
        if (!partida) return;
        const estado = estadoInicialPartida(partida, base.pacote);
        estado.historico = Array.isArray(estado.historico) ? estado.historico : [];
        const ultima = estado.historico.shift();
        if (!ultima || ultima.tipo !== "ponto") {
            salvarEstadoPartida(estado);
            renderPartidaOffline(id);
            return;
        }

        if (ultima.lado === "A") estado.pontos_a = Math.max(0, Number(estado.pontos_a || 0) - 1);
        else estado.pontos_b = Math.max(0, Number(estado.pontos_b || 0) - 1);

        const acao = {
            id: `${Date.now()}_${Math.random().toString(36).slice(2)}`,
            tipo: "desfazer_ponto",
            lado: ultima.lado,
            partida_id: id,
            competicao: estado.competicao,
            pontos_a: estado.pontos_a,
            pontos_b: estado.pontos_b,
            criado_em: new Date().toISOString(),
            sincronizado: false
        };
        estado.historico.unshift(acao);
        salvarEstadoPartida(estado);
        await salvarAcaoFila(acao);
        renderPartidaOffline(id);
    }

    function filaPendentePartida(partidaId) {
        const fila = lerJson(LOCAL_FILA_KEY, []);
        return fila.filter(a => normalizarId(a.partida_id) === normalizarId(partidaId) && !a.sincronizado).length;
    }

    function renderPartidaCard(p) {
        const urlOffline = `#partida=${encodeURIComponent(normalizarId(p.id))}`;
        return `
            <div class="offline-partida">
                <div>
                    <strong>${htmlSeguro(obterNomeA(p))} x ${htmlSeguro(obterNomeB(p))}</strong>
                    <div class="offline-meta">Jogo ${htmlSeguro(p.ordem || p.id || "-")}${p.quadra ? " • Quadra " + htmlSeguro(p.quadra) : ""}${p.grupo ? " • " + htmlSeguro(p.grupo) : ""}</div>
                    <div class="offline-meta">${htmlSeguro(p.status_operacao || p.status || "offline")}</div>
                </div>
                <div class="offline-acoes">
                    <a class="offline-btn offline-btn-primary" href="${urlOffline}">Abrir offline</a>
                </div>
            </div>
        `;
    }

    async function renderLista() {
        const el = document.getElementById("offline-conteudo");
        const { sessao, pacotes, pacote, partidas } = await carregarBaseOffline();

        if (!sessao && pacotes.length === 0 && partidas.length === 0) {
            el.innerHTML = `<div class="offline-alerta">Nenhuma competição foi baixada neste dispositivo. Entre online, abra o painel do apontador e clique em <strong>Baixar competição</strong>.</div>`;
            return;
        }

        const resumo = pacote.resumo || {};
        const nome = (sessao && (sessao.nome || sessao.usuario)) || pacote.nome_usuario || "Apontador";
        const competicao = (sessao && sessao.competicao) || pacote.competicao || "Competição offline";

        el.innerHTML = `
            <h2 style="margin:0;color:#0f2f4a;">${htmlSeguro(competicao)}</h2>
            <div class="offline-meta">Sessão offline ativa para ${htmlSeguro(nome)}${navigator.onLine ? " • Online agora" : " • Sem internet agora"}</div>

            <div class="offline-ok" style="margin-top:14px;">✅ Competição disponível offline neste dispositivo.</div>

            <div class="offline-grid">
                <div class="offline-kpi"><strong>${partidas.length}</strong><span>Partidas disponíveis</span></div>
                <div class="offline-kpi"><strong>${resumo.total_equipes || (pacote.equipes || []).length || 0}</strong><span>Equipes baixadas</span></div>
                <div class="offline-kpi"><strong>${resumo.total_atletas || (pacote.atletas || []).length || 0}</strong><span>Atletas baixados</span></div>
            </div>

            <div class="offline-actions-bar">
                <a class="offline-btn offline-btn-dark" href="/apontador">Voltar ao painel</a>
                <a class="offline-btn offline-btn-primary" href="${htmlSeguro((sessao && sessao.url_painel) || "/apontador")}">Abrir competição online</a>
                <button type="button" class="offline-btn offline-btn-gold" onclick="location.reload()">Atualizar tela</button>
            </div>

            <h3 style="margin:18px 0 0;color:#0f2f4a;">Partidas baixadas</h3>
            <div class="offline-lista">
                ${partidas.length ? partidas.map(renderPartidaCard).join("") : `<div class="offline-alerta">Nenhuma partida foi encontrada no pacote offline.</div>`}
            </div>
        `;
    }

    async function renderPartidaOffline(partidaId) {
        const el = document.getElementById("offline-conteudo");
        const base = await carregarBaseOffline();
        const partida = base.partidas.find(p => normalizarId(p.id) === normalizarId(partidaId));

        if (!partida) {
            el.innerHTML = `<div class="offline-alerta">Partida offline não encontrada neste dispositivo.</div><div class="offline-actions-bar"><a class="offline-btn offline-btn-dark" href="/offline-apontador">Voltar</a></div>`;
            return;
        }

        const estado = estadoInicialPartida(partida, base.pacote);
        salvarEstadoPartida(estado);
        const pendentes = filaPendentePartida(partidaId);
        const hist = Array.isArray(estado.historico) ? estado.historico : [];

        el.innerHTML = `
            <div class="offline-actions-bar" style="margin-top:0;">
                <a class="offline-btn offline-btn-dark" href="#">← Voltar às partidas</a>
                <span class="offline-btn offline-btn-gold" style="cursor:default;">${pendentes} ação(ões) pendente(s)</span>
            </div>

            <h2 style="margin:16px 0 4px;color:#0f2f4a;">${htmlSeguro(estado.equipe_a)} x ${htmlSeguro(estado.equipe_b)}</h2>
            <div class="offline-meta">Jogo ${htmlSeguro(partida.ordem || partida.id || "-")}${partida.quadra ? " • Quadra " + htmlSeguro(partida.quadra) : ""}${partida.grupo ? " • " + htmlSeguro(partida.grupo) : ""} • Operação offline</div>

            <div class="offline-scoreboard">
                <div class="offline-team">
                    <h2>${htmlSeguro(estado.equipe_a)}</h2>
                    <div class="offline-score">${Number(estado.pontos_a || 0)}</div>
                    <button type="button" class="offline-btn offline-btn-primary" onclick="registrarPontoOffline('A')">+ Ponto</button>
                </div>
                <div class="offline-center">X</div>
                <div class="offline-team">
                    <h2>${htmlSeguro(estado.equipe_b)}</h2>
                    <div class="offline-score">${Number(estado.pontos_b || 0)}</div>
                    <button type="button" class="offline-btn offline-btn-primary" onclick="registrarPontoOffline('B')">+ Ponto</button>
                </div>
            </div>

            <div class="offline-mini-grid">
                <div class="offline-mini">Set atual: ${htmlSeguro(estado.set_atual || 1)}</div>
                <div class="offline-mini">Sets: ${htmlSeguro(estado.sets_a || 0)} x ${htmlSeguro(estado.sets_b || 0)}</div>
            </div>

            <div class="offline-actions-bar">
                <button type="button" class="offline-btn offline-btn-gold" onclick="desfazerOffline()">↩ Desfazer último ponto</button>
                <button type="button" class="offline-btn offline-btn-dark" onclick="alert('Sincronização será a próxima etapa. As ações já estão salvas localmente.')">🔄 Sincronizar depois</button>
            </div>

            <div class="offline-alerta" style="margin-top:14px;">⚠️ Esta é a primeira operação offline: pontos ficam salvos neste dispositivo e entram na fila para sincronizar depois.</div>

            <h3 style="margin:18px 0 0;color:#0f2f4a;">Histórico offline</h3>
            <div class="offline-history">
                ${hist.length ? hist.slice(0, 30).map(a => `
                    <div class="offline-history-item">
                        ${htmlSeguro(a.tipo)} • ${htmlSeguro(a.lado || "")} • Placar ${htmlSeguro(a.pontos_a)} x ${htmlSeguro(a.pontos_b)} • ${htmlSeguro(new Date(a.criado_em).toLocaleTimeString())}
                    </div>
                `).join("") : `<div class="offline-alerta">Nenhuma ação offline registrada ainda.</div>`}
            </div>
        `;
    }

    async function roteador() {
        const hash = location.hash || "";
        if (hash.startsWith("#partida=")) {
            const id = decodeURIComponent(hash.replace("#partida=", ""));
            await renderPartidaOffline(id);
            return;
        }
        await renderLista();
    }

    window.registrarPontoOffline = registrarPontoOffline;
    window.desfazerOffline = desfazerOffline;
    window.addEventListener("hashchange", roteador);
    roteador().catch(e => {
        console.error(e);
        const el = document.getElementById("offline-conteudo");
        if (el) el.innerHTML = `<div class="offline-alerta">Erro ao abrir os dados offline deste dispositivo: ${htmlSeguro(e.message || e)}</div>`;
    });
})();
</script>
{% endblock %}
