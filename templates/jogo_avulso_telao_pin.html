<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Telão Jogo Rápido</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:#fff;font-family:Arial,Helvetica,sans-serif}.tela{width:100vw;height:100vh;display:grid;grid-template-rows:72px 1fr;padding:16px;gap:14px;background:radial-gradient(circle at 20% 10%,rgba(37,99,235,.35),transparent 30%),radial-gradient(circle at 80% 10%,rgba(245,158,11,.28),transparent 34%),linear-gradient(135deg,#07111f,#101827 52%,#020617)}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}.status{justify-self:center;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.18);border-radius:999px;padding:12px 24px;font-size:clamp(18px,2vw,32px);font-weight:1000;text-transform:uppercase;letter-spacing:.04em}.pin{justify-self:end;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 14px;font-weight:1000}.main{display:grid;grid-template-columns:1fr 270px 1fr;gap:16px;min-height:0}.team{min-width:0;border:3px solid rgba(255,255,255,.25);border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden}.name{font-size:clamp(34px,5vw,74px);font-weight:1000;text-align:center;line-height:.95;padding:0 16px}.pts{font-size:clamp(140px,20vw,300px);font-weight:1000;line-height:.85}.serve{height:46px;margin-top:8px;color:#fde68a;font-size:clamp(18px,2vw,34px);font-weight:1000}.center{border-radius:30px;background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:16px}.setlabel{font-size:22px;font-weight:1000;color:#facc15}.sets{font-size:80px;font-weight:1000}.setatual{font-size:28px;font-weight:1000}.aguarda{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#07111f;text-align:center;padding:30px}.aguarda.on{display:flex}.aguarda h1{font-size:clamp(34px,6vw,82px);margin:0 0 12px}.aguarda p{font-size:clamp(18px,2.4vw,34px);color:#cbd5e1;font-weight:900}@media(max-width:900px){.main{grid-template-columns:1fr 150px 1fr}.tela{padding:8px;gap:8px}.top{grid-template-columns:1fr}.pin{display:none}.status{font-size:16px}.name{font-size:28px}.pts{font-size:110px}.sets{font-size:42px}.setatual{font-size:18px}.center{border-radius:20px;padding:8px}.serve{font-size:18px}}
</style>
</head>
<body>
<div id="aguarda" class="aguarda"><div><h1>AGUARDANDO JOGO RÁPIDO</h1><p>PIN {{ pin }} vinculado. Quando o apontador iniciar outro jogo, o telão atualiza sozinho.</p></div></div>
<div id="tela" class="tela">
  <div class="top"><div></div><div id="status" class="status">JOGO RÁPIDO</div><div class="pin">PIN {{ pin }}</div></div>
  <main class="main">
    <section class="team"><div id="nomeA" class="name">Equipe A</div><div id="ptsA" class="pts">0</div><div id="saqueA" class="serve"></div></section>
    <aside class="center"><div class="setlabel">SETS</div><div class="sets"><span id="setsA">0</span> × <span id="setsB">0</span></div><div id="setAtual" class="setatual">1º SET</div></aside>
    <section class="team"><div id="nomeB" class="name">Equipe B</div><div id="ptsB" class="pts">0</div><div id="saqueB" class="serve"></div></section>
  </main>
</div>
<script>
const PIN={{ pin|tojson }};
let codigo={{ (vinculo.codigo if vinculo else '')|tojson }};
let estado={};
function el(id){return document.getElementById(id)}
function renderAguardando(on){el('aguarda').classList.toggle('on',!!on);el('tela').style.display=on?'none':'grid'}
function nome(l){return l==='A'?(estado.equipe_a||'Equipe A'):(estado.equipe_b||'Equipe B')}
function sacador(l){const r=l==='A'?(estado.rotacao_a||[]):(estado.rotacao_b||[]);return r[5]||''}
function render(){
  if(!codigo){renderAguardando(true);return} renderAguardando(false);
  el('nomeA').textContent=nome('A'); el('nomeB').textContent=nome('B');
  el('ptsA').textContent=estado.pontos_a||estado.placar_a||0; el('ptsB').textContent=estado.pontos_b||estado.placar_b||0;
  el('setsA').textContent=estado.sets_a||0; el('setsB').textContent=estado.sets_b||0; el('setAtual').textContent=(estado.set_atual||1)+'º SET';
  el('saqueA').textContent=estado.saque_atual==='A'?('🏐 Sacando nº '+(sacador('A')||'?')):'';
  el('saqueB').textContent=estado.saque_atual==='B'?('🏐 Sacando nº '+(sacador('B')||'?')):'';
  const st=String(estado.status_jogo||estado.fase_partida||'').toLowerCase();
  el('status').textContent=st.includes('final')?'JOGO FINALIZADO':'JOGO RÁPIDO AO VIVO';
}
async function buscarAtual(){
  try{const r=await fetch(`/jogo-avulso/pin/${PIN}/atual`,{cache:'no-store'});const j=await r.json(); if(j&&j.tem_jogo&&j.codigo){codigo=j.codigo; return true;} codigo=''; return false;}catch(e){return false;}
}
async function sync(){
  const tem=await buscarAtual();
  if(!tem){render();return}
  try{const r=await fetch(`/apontador/jogo-avulso/${codigo}/estado`,{cache:'no-store'});const j=await r.json();if(j.estado){estado=j.estado;render()}}catch(e){render()}
}
sync();setInterval(sync,2000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
</script>
</body>
</html>
