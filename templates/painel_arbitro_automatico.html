<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ titulo }}</title>
    <link rel="manifest" href="/manifest-arbitro.json">
    <meta name="theme-color" content="#07111f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Pro Árbitro">
    <style>
        html, body { width:100%; height:100%; margin:0; background:#020617; overflow:hidden; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        .orientacao { display:none; position:fixed; inset:0; z-index:9999; background:#020617; color:white; align-items:center; justify-content:center; text-align:center; padding:28px; font-size:26px; font-weight:950; line-height:1.25; }
        @media (orientation: portrait) { .orientacao { display:flex; } }
    </style>
</head>
<body>
    <div class="orientacao">📱 Vire o celular para a horizontal<br><span style="font-size:16px;color:#94a3b8;margin-top:10px;display:block;">Painel dos árbitros</span></div>

    {% set standby_proxima_url = endpoint_status %}
    {% set standby_inicial_ativo = true %}
    {% include "standby_arbitragem.html" %}

    <script>
        window.STANDBY_PROXIMA_URL = {{ endpoint_status|tojson }};
        window.addEventListener("load", () => {
            if (typeof mostrarStandbyArbitragem === "function") mostrarStandbyArbitragem();
        });
    </script>
</body>
</html>
